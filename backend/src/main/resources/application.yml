spring:
  application:
    name: cipher-relay
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/cipher}
    username: ${DATABASE_USERNAME:cipher}
    password: ${DATABASE_PASSWORD:cipher}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

cipher:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
  ratelimit:
    auth:
      capacity: 10
      refill-per-minute: 10
  seed:
    enabled: false
  attachments:
    max-size: 25MB
    storage-path: ${ATTACHMENTS_PATH:./data/blobs}

---
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    com.cipher: DEBUG

cipher:
  seed:
    enabled: true
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me-32+}

---
spring:
  config:
    activate:
      on-profile: test
  flyway:
    enabled: true

cipher:
  seed:
    enabled: false
  jwt:
    secret: test-only-secret-not-for-production-use-0123456789abcdef

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

cipher:
  seed:
    enabled: false
  jwt:
    secret: ${JWT_SECRET}
