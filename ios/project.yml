name: Cipher

options:
  bundleIdPrefix: com.cipher
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  CipherCore:
    path: Packages/CipherCore
  CipherCrypto:
    path: Packages/CipherCrypto
  CipherNetworking:
    path: Packages/CipherNetworking
  CipherPersistence:
    path: Packages/CipherPersistence
  CipherDesign:
    path: Packages/CipherDesign

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    CODE_SIGN_STYLE: Automatic
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "NO"

targets:
  Cipher:
    type: application
    platform: iOS
    sources:
      - Cipher
    dependencies:
      - package: CipherCore
      - package: CipherCrypto
      - package: CipherNetworking
      - package: CipherPersistence
      - package: CipherDesign
    info:
      path: Cipher/Resources/Info.plist
      properties:
        CFBundleDisplayName: Cipher
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: "Cipher uses the camera to scan a contact's safety QR code."
        NSPhotoLibraryUsageDescription: "Cipher uses your photo library to attach photos to encrypted messages."
        NSFaceIDUsageDescription: "Cipher uses Face ID to unlock the app."
        NSMotionUsageDescription: "Cipher uses motion to hide your messages when the phone is placed face down."
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: Cipher/Resources/Cipher.entitlements
      properties:
        com.apple.developer.default-data-protection: NSFileProtectionComplete
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cipher.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  CipherTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CipherTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: Cipher

schemes:
  Cipher:
    build:
      targets:
        Cipher: all
        CipherTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CipherTests
