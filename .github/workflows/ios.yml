name: iOS CI

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Swift package (macOS host)
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Every package declares platforms: [.iOS(.v17), .macOS(.v14)] in its Package.swift and
        # guards UIKit / CoreHaptics behind canImport, so all five compile with `swift build` on a
        # macOS host (verified locally with `swift build` in each package directory).
        package: [CipherCore, CipherCrypto, CipherNetworking, CipherPersistence, CipherDesign]
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"

      # Blocking: the package must compile.
      - name: swift build
        working-directory: ios/Packages/${{ matrix.package }}
        run: swift build

      # Package test targets are placeholders except CipherDesign (schedule, trust tiers, tokens);
      # the real suites are deferred to the hardening pass. Until then this step reports but does
      # not block; remove continue-on-error once the suites land.
      - name: swift test
        working-directory: ios/Packages/${{ matrix.package }}
        run: swift test --parallel
        continue-on-error: true

  app:
    name: App build + tests (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"

      # The project is generated from ios/project.yml (see `make ios-generate`); regenerating in CI
      # guarantees every file under ios/Cipher is in the target, exactly as it is locally.
      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available | grep -oE "iPhone [0-9]+( Pro)?" | sort -V | tail -1)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # Blocking: the app must build for the simulator.
      - name: Build
        run: >
          xcodebuild -project ios/Cipher.xcodeproj -scheme Cipher
          -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}"
          -quiet build CODE_SIGNING_ALLOWED=NO

      # CipherTests holds a placeholder until the ViewModel and integration suites land in the
      # hardening pass. Reports, does not block; remove continue-on-error when they do.
      - name: Test
        run: >
          xcodebuild -project ios/Cipher.xcodeproj -scheme Cipher
          -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}"
          -quiet test CODE_SIGNING_ALLOWED=NO -resultBundlePath TestResults.xcresult
        continue-on-error: true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: TestResults.xcresult
          if-no-files-found: ignore

  lint:
    name: SwiftLint (strict)
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: brew install swiftlint
      - working-directory: ios
        run: swiftlint --strict --reporter github-actions-logging
